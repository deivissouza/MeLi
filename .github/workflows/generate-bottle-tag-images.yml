name: Generate BOTTLE-TAG images

on:
  push:
    paths:
      - '.github/workflows/generate-bottle-tag-images.yml'
      - 'scripts/generate_bottle_tag_images.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate BOTTLE-TAG gallery
        run: python scripts/generate_bottle_tag_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/bottle-tag/*.jpg
          git diff --cached --quiet || git commit -m "Gera galeria BOTTLE-TAG"
          git push
