name: Generate OWA-NAME images

on:
  push:
    paths:
      - '.github/workflows/generate-owala-images.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate corrected images
        run: python scripts/generate_owala_images.py

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/owala-name/*.jpg
          git diff --cached --quiet || git commit -m "Gera imagens corrigidas OWA-NAME com aba de encaixe"
          git push
