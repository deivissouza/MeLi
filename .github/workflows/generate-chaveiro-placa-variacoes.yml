name: Gerar imagens variações chaveiro placa laser

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_chaveiro_placa_variacoes.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python scripts/generate_chaveiro_placa_variacoes.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/chaveiro-placa-laser/variacao-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona imagens individuais das variações do chaveiro laser"
          git push
