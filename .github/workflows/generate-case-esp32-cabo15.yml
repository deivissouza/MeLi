name: Gerar JPG Case ESP32 Cabo15
on:
  push:
    paths:
      - 'scripts/generate_case_esp32_cabo15.py'
      - 'imagens/case-esp32-micro-usb-30p-cabo15/*.svg'
      - '.github/workflows/generate-case-esp32-cabo15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cairosvg pillow
      - run: python scripts/generate_case_esp32_cabo15.py
      - name: Publicar os JPGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/case-esp32-micro-usb-30p-cabo15/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publica imagens ilustrativas JPG do case ESP32 Cabo15"
            git push
          fi
